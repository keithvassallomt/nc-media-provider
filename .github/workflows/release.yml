name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # compileSdk 37 is the android-37.0 package. AGP 9.3.1 defaults to Build Tools 36.0.0.
  ANDROID_PLATFORM: platforms;android-37.0
  ANDROID_BUILD_TOOLS_VERSION: 36.0.0
  # The release key's certificate (docs/play-notes.md). An APK signed with any other key is refused.
  RELEASE_CERT_SHA256: 08c0a928bd7122d3a2b994d2497ad77e1adee46e854ecc6e2de193205f6eaecd

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to create the release and attach its files
    steps:
      # Actions are pinned to a commit; the comment names its release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The release notes are the tag's section of CHANGELOG.md. Without one, the release stops before building.
      - name: Read the release notes
        run: python3 tools/release.py notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"

      # No Gradle cache: a release builds from a clean slate.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS_VERSION"

      # Secrets reach each step through env, never through the script text. GitHub masks them in logs.
      - name: Restore the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::The repository secret $name is not set."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease

      - name: Check the signature and version, name the files
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          certs="$("$build_tools/apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$certs"
          digests="$(printf '%s\n' "$certs" | sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p')"
          if [ "$digests" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::The APK is not signed by the release key alone (certificate SHA-256 $RELEASE_CERT_SHA256)."
            exit 1
          fi
          version_name="$("$build_tools/aapt2" dump badging "$apk" | sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p")"
          if [ "v$version_name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but the APK's versionName is $version_name."
            exit 1
          fi
          mkdir "$RUNNER_TEMP/release"
          cp "$apk" "$RUNNER_TEMP/release/nc-media-provider-$GITHUB_REF_NAME.apk"
          cp "$aab" "$RUNNER_TEMP/release/nc-media-provider-$GITHUB_REF_NAME.aab"
          cd "$RUNNER_TEMP/release"
          sha256sum -- *.apk *.aab > SHA256SUMS
          cat SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "NC Media Provider $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag

      - name: Delete the release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
