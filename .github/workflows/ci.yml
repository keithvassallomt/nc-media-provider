name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # compileSdk 37 is the android-37.0 package. AGP 9.3.1 defaults to Build Tools 36.0.0.
  ANDROID_PLATFORM: platforms;android-37.0
  ANDROID_BUILD_TOOLS_VERSION: 36.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to a commit; the comment names its release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # setup-java caches ~/.gradle (MIT). setup-gradle v6 caches through a proprietary component.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The runner image already has these today; this keeps the build working if it drops them.
      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS_VERSION"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nc-media-provider-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
